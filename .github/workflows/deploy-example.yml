# .github/workflows/deploy-example.yml
#
# Demonstrates how a CI/CD pipeline calls deploy-gate's POST /approval/check
# right before `cdk deploy`. This workflow builds and boots the real
# deploy-gate app, then exercises all three approval paths using the seeded
# demo data (see config/DemoDataSeeder):
#   - jiye -> SmallAppStack: approvalLevel=NONE, has the required claim -> 200 OK
#   - jiye -> StagingApiStack: approvalLevel=SINGLE_APPROVER -> 202 Pending,
#     then alice approves -> 200 OK
#   - jiye -> ProdAlbStack: approvalLevel=DUAL_APPROVER -> 202 Pending,
#     stays pending after one of two approvals, then 200 OK once both
#     alice and bob (distinct approvers) approve
name: Deploy Example (deploy-gate integration demo)

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    # Demo-only credentials, matching config/DemoDataSeeder. They are safe to keep in
    # the workflow precisely because seeding is off unless explicitly enabled, so these
    # tokens are never valid against a real deployment.
    env:
      CI_TOKEN: demo-ci-service-token
      APPROVER_ALICE_TOKEN: dgt_demo_alice
      APPROVER_BOB_TOKEN: dgt_demo_bob
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build executable jar
        run: ./gradlew bootJar

      - name: Start deploy-gate
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" \
            --deploygate.demo-data.enabled=true \
            --deploygate.ci.token="$CI_TOKEN" > app.log 2>&1 &
          # Poll the *readiness* probe, not plain /actuator/health: health only
          # reports DB connectivity, but DemoDataSeeder (a CommandLineRunner)
          # finishes seeding *after* Tomcat already starts accepting requests.
          # Readiness only flips UP once all CommandLineRunners have completed,
          # so this avoids a race where the first request lands before seed
          # data exists.
          echo "Waiting for /actuator/health/readiness..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health/readiness | grep -q '"UP"'; then
              echo "deploy-gate is up"
              exit 0
            fi
            sleep 2
          done
          echo "deploy-gate did not become healthy in time"
          cat app.log
          exit 1

      - name: cdk deploy step (SmallAppStack) -- expect immediate approval
        run: |
          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"SmallAppStack","action":"DEPLOY"}')
          echo "response: $(cat response.json)"
          if [ "$STATUS" != "200" ]; then
            echo "expected 200 OK for SmallAppStack but got $STATUS"
            exit 1
          fi
          echo "approved -> cdk deploy SmallAppStack (example, not actually run)"

      - name: cdk deploy step (StagingApiStack) -- single-approver flow
        run: |
          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"StagingApiStack","action":"DEPLOY"}')
          echo "check response: $(cat response.json)"
          if [ "$STATUS" != "202" ]; then
            echo "expected 202 Pending for StagingApiStack but got $STATUS"
            exit 1
          fi

          curl -s -o request.json -X POST http://localhost:8080/approval/request \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"StagingApiStack","action":"DEPLOY"}'
          echo "request response: $(cat request.json)"
          REQUEST_ID=$(jq -r '.id' request.json)

          STATUS=$(curl -s -o approve.json -w '%{http_code}' -X POST "http://localhost:8080/approval/$REQUEST_ID/approve" \
            -H "Authorization: Bearer $APPROVER_ALICE_TOKEN")
          echo "approve response: $(cat approve.json)"
          if [ "$STATUS" != "200" ] || [ "$(jq -r '.status' approve.json)" != "APPROVED" ]; then
            echo "expected a single alice approval to fully approve StagingApiStack's request"
            exit 1
          fi

          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"StagingApiStack","action":"DEPLOY"}')
          echo "recheck response: $(cat response.json)"
          if [ "$STATUS" != "200" ]; then
            echo "expected 200 OK for StagingApiStack after approval but got $STATUS"
            exit 1
          fi
          echo "approved -> cdk deploy StagingApiStack (example, not actually run)"

      - name: cdk deploy step (ProdAlbStack) -- dual-approver flow
        run: |
          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"ProdAlbStack","action":"DEPLOY"}')
          echo "check response: $(cat response.json)"
          if [ "$STATUS" != "202" ]; then
            echo "expected 202 Pending for ProdAlbStack but got $STATUS"
            exit 1
          fi

          curl -s -o request.json -X POST http://localhost:8080/approval/request \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"ProdAlbStack","action":"DEPLOY"}'
          echo "request response: $(cat request.json)"
          REQUEST_ID=$(jq -r '.id' request.json)

          curl -s -o approve1.json -X POST "http://localhost:8080/approval/$REQUEST_ID/approve" \
            -H "Authorization: Bearer $APPROVER_ALICE_TOKEN"
          echo "alice approve response: $(cat approve1.json)"
          if [ "$(jq -r '.status' approve1.json)" != "PENDING" ]; then
            echo "expected ProdAlbStack request to still be PENDING after only one of two approvals"
            exit 1
          fi

          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"ProdAlbStack","action":"DEPLOY"}')
          echo "recheck after 1/2 response: $(cat response.json)"
          if [ "$STATUS" != "202" ]; then
            echo "expected 202 Pending for ProdAlbStack after only one approval but got $STATUS"
            exit 1
          fi

          STATUS=$(curl -s -o approve2.json -w '%{http_code}' -X POST "http://localhost:8080/approval/$REQUEST_ID/approve" \
            -H "Authorization: Bearer $APPROVER_BOB_TOKEN")
          echo "bob approve response: $(cat approve2.json)"
          if [ "$STATUS" != "200" ] || [ "$(jq -r '.status' approve2.json)" != "APPROVED" ]; then
            echo "expected a second, distinct approval (bob) to fully approve ProdAlbStack's request"
            exit 1
          fi

          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $CI_TOKEN" \
            -d '{"user":"jiye","stack":"ProdAlbStack","action":"DEPLOY"}')
          echo "recheck response: $(cat response.json)"
          if [ "$STATUS" != "200" ]; then
            echo "expected 200 OK for ProdAlbStack after both approvals but got $STATUS"
            exit 1
          fi
          echo "approved -> cdk deploy ProdAlbStack (example, not actually run)"

      - name: Show approval history
        if: always()
        run: |
          curl -s -H "Authorization: Bearer $APPROVER_ALICE_TOKEN" "http://localhost:8080/approval/history" | jq .

      - name: Show app log
        if: always()
        run: cat app.log
