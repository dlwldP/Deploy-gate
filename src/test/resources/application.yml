spring:
  application:
    name: deploy-gate
  datasource:
    url: jdbc:h2:mem:deploygate-test-${random.uuid}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

deploygate:
  demo-data:
    enabled: true
  ci:
    token: test-ci-service-token
